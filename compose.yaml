
services:
  api:
    build: .
    container_name: ai-chat-api

    ports:
      - "8000:8000"

    environment:
      APP_ENV: development
      APP_VERSION: "0.1.0"

    volumes:
      - ./src:/app/src

    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - ai_chat_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

